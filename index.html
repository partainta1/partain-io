<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARTAIN I/O</title>
  <meta name="description" content="Applied AI and platform engineering for the SMB market. Agentic AI, generative AI, and the infrastructure to run it in production." />

  <!-- Favicon: inline SVG, the blue slash mark -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050506'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%233d8bff'%3E/%3C/text%3E%3C/svg%3E" />

  <!-- Open Graph / social share preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PARTAIN I/O" />
  <meta property="og:title" content="PARTAIN I/O" />
  <meta property="og:description" content="Applied AI and platform engineering for the SMB market. By invitation." />
  <meta property="og:url" content="https://www.partain.io/" />
  <meta property="og:image" content="https://www.partain.io/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PARTAIN I/O" />
  <meta name="twitter:description" content="Applied AI and platform engineering for the SMB market. By invitation." />
  <meta name="twitter:image" content="https://www.partain.io/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050506;
      --fg: #f4f4f2;
      --muted: #9a9a9f;
      --faint: #616167;
      --blue: #3d8bff;
      --blue-text: #a9caff;
      --blue-soft: rgba(61, 139, 255, 0.13);
      --pill-border: #26262b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Breathing aurora glow behind the content */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(42rem 30rem at 50% -8%, rgba(61,139,255,0.16), transparent 60%),
        radial-gradient(30rem 22rem at 82% 12%, rgba(61,139,255,0.08), transparent 60%);
      animation: breathe 11s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(1.5rem); }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 660px;
      width: 100%;
      text-align: center;
    }

    .reveal { opacity: 0; transform: translateY(14px); animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.20s; }
    .d3 { animation-delay: 0.35s; }
    .d4 { animation-delay: 0.50s; }
    .d5 { animation-delay: 0.65s; }
    .d6 { animation-delay: 0.80s; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .wordmark {
      font-family: "Space Grotesk", monospace;
      font-size: clamp(2.6rem, 9vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      margin: 0 0 1.75rem;
      line-height: 1;
    }
    .wordmark .slash {
      color: var(--blue);
      text-shadow: 0 0 26px rgba(61,139,255,0.55);
      animation: pulse 4.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 22px rgba(61,139,255,0.40); }
      50%      { text-shadow: 0 0 34px rgba(61,139,255,0.75); }
    }

    .headline {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin: 0 auto 1rem;
      max-width: 22ch;
    }
    .headline .accent { color: var(--blue); }

    .intro { font-size: 1.02rem; line-height: 1.6; color: var(--muted); margin: 0 auto 2.75rem; max-width: 34rem; }

    .caps { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; margin: 0 auto 3rem; max-width: 36rem; }
    .caps span {
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      border: 1px solid var(--pill-border);
      color: var(--muted);
      white-space: nowrap;
      transition: border-color 0.25s ease, color 0.25s ease;
    }
    .caps span:hover { border-color: var(--blue); color: var(--fg); }
    .caps span.lead { border-color: transparent; background: var(--blue-soft); color: var(--blue-text); }

    .values { display: flex; flex-wrap: wrap; gap: 2.25rem; justify-content: center; margin: 0 0 3rem; padding: 0; list-style: none; }
    .values li { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }

    .invite {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
      border: 1px solid var(--blue);
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      margin: 0 0 2.5rem;
    }

    footer { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
    .contact { font-size: 0.9rem; letter-spacing: 0.02em; }
    .contact a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; transition: color 0.2s ease, border-color 0.2s ease; }
    .contact a:hover { color: var(--blue-text); border-color: var(--blue); }
    .copyright { font-size: 0.75rem; color: var(--faint); margin: 0; }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .aurora, .wordmark .slash { animation: none; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main>
    <h1 class="wordmark reveal d1">PARTAIN&nbsp;I<span class="slash">/</span>O</h1>

    <p class="headline reveal d2">Applied AI and <span class="accent">platform engineering.</span></p>
    <p class="intro reveal d2">A boutique practice built on depth, precision, and judgment.</p>

    <ul class="values reveal d3">
      <li>Precision</li>
      <li>Velocity</li>
      <li>Innovation</li>
      <li>Results</li>
    </ul>

    <p class="invite reveal d4">By selection only</p>

    <footer class="reveal d5">
      <!-- Update the email below to your preferred inbox -->
      <p class="contact"><a href="mailto:hello@partain.io">hello@partain.io</a></p>
      <p class="copyright">&copy; 2026 PARTAIN I/O. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
